plugins {
    id 'java'
    id 'com.cleanroommc.cleanroomgradle'
    id 'set.cleanroom'
}
group = 'cc.orthrus.riven'
version = mod_version
// Cleanroom on Java 25 or 26 is the only target (docs/DECISIONS.md, 2026-10-30). The platform (Java, Cleanroom, the
// JDK builds) comes from the set, which set.base reads; set.cleanroom sets cleanroom_version from it.
def compilerJavaVersion = providers.gradleProperty('rivenJavaVersion').getOrElse(set.platform().java as String).toInteger()
// The mods Riven compiles against, as the game loads them (SRG names): the files the set names, from the Store by
// their SHA-256 (or a stand-in), so the build and the game read one JAR of each.
def cubatureJar = set.jar('cubature')
def gtceurJar = set.jar('gtceur')
def sha256 = { File f -> java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString() }
base { archivesName = 'riven' }
java {
    toolchain { languageVersion = JavaLanguageVersion.of(compilerJavaVersion) }
    // A qualification compiler must not silently change the development bytecode pin.
    sourceCompatibility = JavaVersion.VERSION_26
    targetCompatibility = JavaVersion.VERSION_26
    withSourcesJar()
}
configurations {
    // Mods in development names through CleanroomGradle's deobf transform: compiled against, never bundled.
    mods { canBeConsumed = false; canBeResolved = false }
    compileOnly.extendsFrom(mods)
    modClasspath { canBeConsumed = false; extendsFrom(mods) }
}
dependencies {
    implementation cleanroom.userdev(cleanroom_version)
    // Compile-time metadata for Gson; no additional runtime mod or bundled dependency.
    compileOnly 'com.google.errorprone:error_prone_annotations:2.41.0'
    // The annotations GTCEu's classes carry (it compiles against 24.1.0), so javac reads them without [classfile] warnings.
    compileOnly 'org.jetbrains:annotations:24.1.0'
    mods deobf(cubatureJar)
    mods deobf(gtceurJar)   // optional ore catalogue provider
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all,-options', '-Werror'])
}
sourceSets {
    diagnostics {
        java.srcDir 'tools/checks'
        compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath
        // Minecraft and Cleanroom as they run (the userdev's runtime view), plus the same deobfuscated mods
        // and the game's own resources (client-extra: recipes, lang), which runClient adds the same way.
        runtimeClasspath = output + sourceSets.main.runtimeClasspath + configurations.modClasspath +
            configurations._cleanroomUserdevClientExtra
    }
}
tasks.named('compileDiagnosticsJava', JavaCompile) {
    group = 'verification'
    description = 'Lint and type-check diagnostic helpers without running them.'
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(compilerJavaVersion) }
    sourceCompatibility = '26'
    targetCompatibility = '26'
}
// Select an entry point with -PrivenDiagnosticMain and pass its arguments with --args. Every run has the
// game bootstrap's class path, so no separate switch is needed.
tasks.register('runDiagnostics', JavaExec) {
    group = 'verification'
    description = 'Run an explicitly selected diagnostic entry point on Java 26.'
    classpath = sourceSets.diagnostics.runtimeClasspath
    mainClass = providers.gradleProperty('rivenDiagnosticMain')
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(26) }
    // Cleanroom's mapped test bootstrap removes final modifiers from object-holder fields.
    jvmArgs '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED'
    def evidence = layout.buildDirectory.file('diagnostics/cubature-mapping.json')
    def plugin = 'com.cleanroommc.cleanroomgradle:' + com.cleanroommc.gradle.CleanroomGradle.getPackage().implementationVersion
    def loader = cleanroom_version
    def revision = set.revision
    doFirst {
        def runtime = classpath.files.toList()
        def input = cubatureJar.singleFile
        def original = sha256(input)
        if (runtime.any { it.canonicalFile == input.canonicalFile }) throw new GradleException('The SRG-named Cubature is on the development class path')
        def api = ['CubePrimer', 'ICubeGenerator'].collect { type ->
            def entry = "io/github/opencubicchunks/cubicchunks/api/worldgen/${type}.class"
            def found = runtime.findAll { it.isDirectory() ? new File(it, entry).isFile()
                : it.isFile() && new java.util.zip.ZipFile(it).withCloseable { z -> z.getEntry(entry) != null } }
            if (found.size() != 1 || !found[0].isFile()) throw new GradleException("One mapped ${type} JAR required: ${found}")
            found[0].canonicalFile
        }.unique()
        if (api.size() != 1) throw new GradleException('Cubature API classes have different providers')
        def mapped = sha256(api[0])
        if (mapped == original) throw new GradleException('Cubature was not deobfuscated')
        def out = evidence.get().asFile
        out.parentFile.mkdirs()
        out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([plugin: plugin,
            mappings: 'mcp:stable_39-1.12', loader: loader, set: revision,
            original: [path: input.canonicalPath, sha256: original], mapped: [path: api[0].path, sha256: mapped],
            runtimeClasspath: runtime*.canonicalPath])) + System.lineSeparator(), 'UTF-8')
    }
}
processResources {
    inputs.property('version', project.version)
    filesMatching('mcmod.info') { expand(version: project.version) }
}
jar {
    archiveClassifier = 'dev'
    manifest { attributes('Implementation-Title': 'Riven', 'Implementation-Version': project.version, 'ModType': 'CRL') }
}
// The production JAR in SRG names: build/libs/riven-<version>-cleanroom.jar, the file the launcher loads.
tasks.named('reobfJar') { archiveClassifier = 'cleanroom' }
// Keep the same license scope visible in binary and matching source distributions.
['jar', 'sourcesJar'].each { taskName ->
    tasks.named(taskName, Jar) {
        from('LICENSE') { into 'META-INF/licenses/riven'; rename { 'NRR-1.0.txt' } }
        from('NOTICE.md') { into 'META-INF'; rename { 'NOTICE-RIVEN.md' } }
    }
}
