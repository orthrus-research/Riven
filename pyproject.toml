[tool.ruff]
target-version = "py314"
line-length = 100
cache-dir = ".local/ruff-cache"
extend-exclude = [".local", "build", "dev"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# These entry points intentionally resolve the owned lab/tool paths before imports.
[tool.ruff.lint.per-file-ignores]
"tools/runtime.py" = ["E402"]
"tools/measure_pipeline.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
files = ["tools"]
mypy_path = ["$MYPY_CONFIG_FILE_DIR/tools"]
cache_dir = ".local/mypy-cache"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
show_error_codes = true

# These optional runtime/plotting integrations are outside this repository's
# type-checking boundary. Missing imports in Riven's own modules remain errors.
[[tool.mypy.overrides]]
module = [
    "cubic_lab", "cubic_standalone", "lab_profiles", "lab_workload", "analyze_cubic_profile",
    "lab_repeated_statistics",
    "matplotlib", "matplotlib.*", "numpy", "PIL",
]
ignore_missing_imports = true
follow_imports = "skip"
