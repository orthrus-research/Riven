[tool.ruff]
target-version = "py314"
line-length = 100
cache-dir = ".local/ruff-cache"
extend-exclude = [".local", "build", "dev"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Cubature's lab modules are found on the path tools/cubature_tools.py adds, so they are imported last, after it.
[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder", "cubature-lab"]

[tool.ruff.lint.isort.sections]
"cubature-lab" = ["analyze_cubic_profile", "cubic_lab", "inspect_cubic_lab_world", "lab_files", "lab_profiles",
                  "lab_repeated_statistics", "lab_session", "lab_workload"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
files = ["tools", "launch"]
mypy_path = ["$MYPY_CONFIG_FILE_DIR/tools"]
cache_dir = ".local/mypy-cache"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
show_error_codes = true

# These optional runtime/plotting integrations are outside this repository's
# type-checking boundary. Missing imports in Riven's own modules remain errors.
[[tool.mypy.overrides]]
module = [
    "cubic_lab", "lab_files", "lab_profiles", "lab_session", "lab_workload", "analyze_cubic_profile",
    "lab_repeated_statistics",
    "matplotlib", "matplotlib.*", "numpy", "PIL",
]
ignore_missing_imports = true
follow_imports = "skip"
