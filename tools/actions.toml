# Local actions for Riven and Cubature. Run with: python tools/actions.py <workflow|job> ...
# Placeholders: {python} the runner's interpreter, {quality_python}, {atlas_python},
# {observability_python}, {run_id} the run's identifier, {frozen} .local/frozen/{run_id},
# {riven} Riven's root, {cubature} the Cubature checkout dev/cc.lock.json names.
#
# Jobs run concurrently once the jobs they need have passed. A job claims `share` of the cores
# (default 0.25), `memory` GiB (default 4) and its `locks`; jobs start, highest `priority` first,
# while the running claims fit the machine (cores, three quarters of its memory) and no two
# running jobs hold the same lock. `native` jobs run alone. actions.py --jobs 1 runs serially.
#
# `inputs` makes a job a pure check: globs of every file its verdict depends on, beside its steps
# and the JDK. A job whose exact inputs passed before is not run again; list every file it reads.

[interpreters]
quality_python = ".local/quality-venv/Scripts/python.exe"
atlas_python = ".local/atlas-venv/Scripts/python.exe"
observability_python = ".local/observability-venv/Scripts/python.exe"

[workflows]
check = ["quality", "regional-store", "drainage-prune", "regional-bake", "atlas-golden", "definitions", "sample-history", "variant-coverage"]
build = ["riven-build", "cubature-build"]
ci = ["quality", "riven-build", "cubature-build", "regional-store", "drainage-prune", "regional-bake", "atlas-golden", "definitions", "sample-history", "variant-coverage"]
full = ["quality", "riven-build", "cubature-build", "regional-store", "drainage-prune", "regional-bake", "atlas-golden", "definitions", "sample-history", "variant-coverage", "smoke"]
# ci with the golden windows resampled and timed; tools/ci_timing.py reports the run (riven.ps1 profile).
profile = ["quality", "riven-build", "cubature-build", "regional-store", "drainage-prune", "regional-bake", "atlas-golden-profile", "definitions", "sample-history", "variant-coverage"]

[jobs.quality]
description = "Formatting, lint, types, both-loader compile, content assets and the Riven and Cubature tool tests"
locks = ["riven-gradle"]
steps = [
  { name = "code quality", run = ["{quality_python}", "tools/code_quality.py", "check"] },
  { name = "content assets", run = ["{quality_python}", "tools/content/build_content.py", "--check"] },
  { name = "riven tool tests", run = ["{observability_python}", "-B", "-m", "unittest", "discover", "-s", "tools", "-p", "test_*.py"] },
  { name = "cubature tool tests", run = ["{observability_python}", "-B", "-m", "unittest", "discover", "-s", "{cubature}/tools", "-p", "test_*.py"] },
]

[jobs.riven-build]
description = "Build Riven for Cleanroom and freeze the artifact for this run"
locks = ["riven-gradle"]
steps = [
  { name = "build riven", run = ["{python}", "tools/build_riven.py", "--diagnostics", "--no-daemon", "--freeze", "{run_id}"] },
]

[jobs.cubature-build]
description = "Build Cubature and the lab observer with Java 26 tests and freeze them"
priority = 5
steps = [
  { name = "build cubature", run = ["{python}", "{cubature}/tools/build_cubature.py", "--workspace", "{riven}", "--no-daemon", "--freeze", "{run_id}"] },
]

[jobs.atlas-golden]
description = "Generated terrain matches the golden atlas digests, with determinism verified"
inputs = ["src/main/java/cc/orthrus/riven/worldgen/**/*.java", "src/main/java/cc/orthrus/riven/contrib/**/*.java", "src/main/resources/*.json", "tools/run_check.py", "tools/atlas/build.py", "tools/atlas_golden.py", "tools/atlas-golden.json", "tools/atlas/*.py", "tools/terrain_atlas.py", "tools/checks/TerrainAtlas.java"]
share = 0.5
memory = 16
priority = 10
steps = [
  { name = "golden digests", run = ["{atlas_python}", "tools/atlas_golden.py", "check", "--verify"] },
]

[jobs.atlas-golden-profile]
description = "atlas-golden with every window resampled and a timed second pass over its built plans"
share = 0.5
memory = 16
priority = 10
steps = [
  { name = "golden digests", run = ["{atlas_python}", "tools/atlas_golden.py", "check", "--verify", "--profile"] },
]

[jobs.definitions]
description = "Definitions catalogues exactly the packaged riven-*.json files, each loads, and the terrain version agrees"
inputs = ["src/main/java/cc/orthrus/riven/worldgen/**/*.java", "src/main/java/cc/orthrus/riven/contrib/**/*.java", "src/main/resources/*.json", "tools/run_check.py", "tools/atlas/build.py", "tools/checks/DefinitionsCheck.java", "CHANGELOG.md", "README.md"]
steps = [
  { name = "definitions", run = ["{atlas_python}", "tools/run_check.py", "DefinitionsCheck", "src/main/resources", "."] },
]

[jobs.regional-store]
description = "Derived-file and graph integrity, mapped-read lifetime, world ownership and cleanup without constructing terrain"
inputs = ["src/main/java/cc/orthrus/riven/worldgen/**/*.java", "src/main/java/cc/orthrus/riven/contrib/**/*.java", "src/main/resources/*.json", "tools/run_check.py", "tools/atlas/build.py", "tools/checks/RegionalStoreCheck.java", "tools/checks/DrainageCodecCheck.java", "tools/checks/RegionalOwnershipCheck.java", "tools/checks/RegionalCleanupCheck.java", "src/main/java/cc/orthrus/riven/RegionalOwnership.java", "src/main/java/cc/orthrus/riven/RegionalCleanup.java"]
steps = [
  { name = "regional file store", run = ["{atlas_python}", "tools/run_check.py", "RegionalStoreCheck", "{frozen}/regional-store-fixtures"] },
  { name = "regional graph and lifetime", run = ["{atlas_python}", "-B", "-c", '''
import os
import subprocess
import sys
import tempfile
from pathlib import Path

tools, source, store_check, fixtures, *checks = map(Path, sys.argv[1:])
sys.path.insert(0, str(tools))
from atlas import build

base = build.compile_sampler(source, store_check)
java = build.java()
gson = build.gson()
fixtures.mkdir(parents=True, exist_ok=True)
output = Path(tempfile.mkdtemp(prefix="helpers-", dir=fixtures))
subprocess.run([
    str(java.with_name("javac.exe")), "--release", "25", "-Xlint:all,-options", "-Werror",
    "-implicit:none", "-cp", os.pathsep.join(map(str, (base, gson))), "-d", str(output),
    *map(str, checks),
], check=True)
classpath = os.pathsep.join(map(str, (output, base, gson)))
for main, fixture, arguments in [
    ("cc.orthrus.riven.worldgen.DrainageCodecCheck", "codec", ["fixtures"]),
    ("cc.orthrus.riven.RegionalOwnershipCheck", "ownership", []),
    ("cc.orthrus.riven.RegionalCleanupCheck", "cleanup", []),
]:
    subprocess.run([str(java), "-cp", classpath, main, str(output / fixture), *arguments], check=True)
''', "{riven}/tools", "{riven}/src/main", "{riven}/tools/checks/RegionalStoreCheck.java", "{frozen}/regional-graph-fixtures", "{riven}/tools/checks/DrainageCodecCheck.java", "{riven}/src/main/java/cc/orthrus/riven/RegionalOwnership.java", "{riven}/src/main/java/cc/orthrus/riven/RegionalCleanup.java", "{riven}/tools/checks/RegionalOwnershipCheck.java", "{riven}/tools/checks/RegionalCleanupCheck.java"] },
]

[jobs.drainage-prune]
description = "Drainage answers are unchanged by skipping continents too far to reach a column (tools/checks/DrainagePruneCheck)"
inputs = ["src/main/java/cc/orthrus/riven/worldgen/**/*.java", "src/main/java/cc/orthrus/riven/contrib/**/*.java", "src/main/resources/*.json", "tools/run_check.py", "tools/atlas/build.py", "tools/checks/DrainagePruneCheck.java"]
memory = 8
priority = 3
steps = [
  { name = "prune, scale 1", run = ["{atlas_python}", "tools/run_check.py", "DrainagePruneCheck", "8675309", "1", "8104", "4552", "1000", "250"] },
  { name = "prune, scale 4", run = ["{atlas_python}", "tools/run_check.py", "DrainagePruneCheck", "8675309", "4", "64", "-64", "1000", "250"] },
]

[jobs.regional-bake]
description = "Region preparation with a store bakes networks to disk and demand reads them back (tools/checks/RegionalBakeCheck)"
inputs = ["src/main/java/cc/orthrus/riven/worldgen/**/*.java", "src/main/java/cc/orthrus/riven/contrib/**/*.java", "src/main/resources/*.json", "tools/run_check.py", "tools/atlas/build.py", "tools/checks/RegionalBakeCheck.java"]
memory = 8
priority = 6
steps = [
  { name = "bake, scale 1", run = ["{atlas_python}", "tools/run_check.py", "RegionalBakeCheck", ".local/actions/{run_id}/regional-bake", "8675309", "1", "0", "0"] },
  { name = "bake, scale 4", run = ["{atlas_python}", "tools/run_check.py", "RegionalBakeCheck", ".local/actions/{run_id}/regional-bake", "8675309", "4", "0", "0"] },
]

[jobs.sample-history]
description = "A reused terrain sample reports what a fresh one does (tools/checks/SampleHistoryCheck)"
inputs = ["src/main/java/cc/orthrus/riven/worldgen/**/*.java", "src/main/java/cc/orthrus/riven/contrib/**/*.java", "src/main/resources/*.json", "tools/run_check.py", "tools/atlas/build.py", "tools/checks/SampleHistoryCheck.java"]
memory = 8
priority = 4
steps = [
  { name = "sample history", run = ["{atlas_python}", "tools/run_check.py", "SampleHistoryCheck", "8675309", "101", "-991", "7", "42", "1"] },
]

[jobs.variant-coverage]
description = "Every biome variant forms patches in a parent biome's climate in every 32 km world (tools/checks/VariantCoverageCheck)"
inputs = ["src/main/java/cc/orthrus/riven/worldgen/**/*.java", "src/main/java/cc/orthrus/riven/contrib/**/*.java", "src/main/resources/*.json", "tools/run_check.py", "tools/atlas/build.py", "tools/checks/VariantCoverageCheck.java"]
memory = 8
steps = [
  { name = "variant coverage", run = ["{atlas_python}", "tools/run_check.py", "VariantCoverageCheck", "8", "4"] },
]

[jobs.smoke]
description = "Native client/server timing capture of this run's frozen Riven and observer"
needs = ["riven-build", "cubature-build"]
native = true
steps = [
  { name = "doctor", run = ["{python}", "-B", "tools/riven_observe.py", "doctor", "--riven", "{frozen}/riven-cleanroom.jar", "--observer", "{frozen}/lab-cleanroom.jar"] },
  { name = "timing capture", run = ["{python}", "-B", "tools/riven_observe.py", "capture", "--name", "smoke-{run_id}", "--riven", "{frozen}/riven-cleanroom.jar", "--observer", "{frozen}/lab-cleanroom.jar", "--mode", "timing"] },
  { name = "inspect", run = ["{observability_python}", "-B", "tools/riven_observe.py", "inspect", ".local/cubic-standalone/smoke-{run_id}", "--output", ".local/actions/{run_id}/smoke-inspect"] },
]

[quick]
# `actions.py quick` runs the ci jobs that the changes since HEAD can affect: Riven's working tree
# against its HEAD and the Cubature checkout against its own. A changed path takes the jobs of the first
# rule it matches ("**" crosses folders, "*" does not); a path no rule matches takes every ci job.
# A push still needs every ci job passed for its tree (tools/push_gate.py): ci --if-needed.
riven = [
  { paths = ["docs/**", "tools/tours/**", ".github/**", "CONTRIBUTING.md", "THIRD-PARTY.md", ".editorconfig"], jobs = [] },
  { paths = ["CHANGELOG.md", "README.md"], jobs = ["definitions"] },
  { paths = ["LICENSE", "NOTICE.md", "src/main/resources/assets/**"], jobs = ["quality", "riven-build"] },
  { paths = [
      "tools/checks/RegionalStoreCheck.java",
      "tools/checks/DrainageCodecCheck.java",
      "tools/checks/RegionalOwnershipCheck.java",
      "tools/checks/RegionalCleanupCheck.java",
    ], jobs = ["quality", "regional-store"] },
  { paths = ["tools/checks/DrainagePruneCheck.java"], jobs = ["quality", "drainage-prune"] },
  { paths = ["tools/checks/RegionalBakeCheck.java"], jobs = ["quality", "regional-bake"] },
  { paths = [
      "tools/checks/CubePrimerBootstrapCheck.java",
      "tools/checks/CubePrimerFixture.java",
      "tools/checks/CubeClassificationCheck.java",
    ], jobs = ["quality", "riven-build"] },
  { paths = ["tools/atlas/**", "tools/atlas_golden.py", "tools/terrain_atlas.py", "tools/run_check.py", "tools/checks/**", "tools/atlas-golden.json"], jobs = ["quality", "atlas-golden", "definitions", "sample-history", "variant-coverage"] },
  { paths = ["tools/build_riven.py"], jobs = ["quality", "riven-build"] },
  { paths = ["tools/**/*.py", "tools/content/**", "tools/strict-math-baseline.json", "pyproject.toml"], jobs = ["quality"] },
]
# Riven builds against the pinned Cubature JARs, so a Cubature change reaches only its own build
# and the tool tests and types in quality.
cubature = [
  { paths = ["docs/**"], jobs = [] },
  { paths = ["**"], jobs = ["quality", "cubature-build"] },
]
