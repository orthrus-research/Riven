# Local actions for Riven and Cubature. Run with: python tools/actions.py <workflow|job> ...
# Placeholders: {python} the runner's interpreter, {quality_python}, {atlas_python},
# {observability_python}, {run_id} the run's identifier, {frozen} .local/frozen/{run_id}.

[interpreters]
quality_python = ".local/quality-venv/Scripts/python.exe"
atlas_python = ".local/atlas-venv/Scripts/python.exe"
observability_python = ".local/observability-venv/Scripts/python.exe"

[workflows]
check = ["quality", "atlas-golden", "definitions", "sample-history"]
build = ["riven-build", "cubature-build"]
ci = ["quality", "riven-build", "cubature-build", "atlas-golden", "definitions", "sample-history"]
full = ["quality", "riven-build", "cubature-build", "atlas-golden", "definitions", "sample-history", "smoke"]

[jobs.quality]
description = "Formatting, lint, types, both-loader compile, content assets and the Riven and Cubature tool tests"
steps = [
  { name = "code quality", run = ["{quality_python}", "tools/code_quality.py", "check"] },
  { name = "content assets", run = ["{quality_python}", "tools/content/build_content.py", "--check"] },
  { name = "riven tool tests", run = ["{observability_python}", "-B", "-m", "unittest", "discover", "-s", "tools", "-p", "test_*.py"] },
  { name = "cubature tool tests", run = ["{observability_python}", "-B", "-m", "unittest", "discover", "-s", "dev/CubicChunks/tools", "-p", "test_*.py"] },
]

[jobs.riven-build]
description = "Build Riven for Cleanroom and freeze the artifact for this run"
steps = [
  { name = "build riven", run = ["{python}", "tools/build_riven.py", "--diagnostics", "--no-daemon", "--freeze", "{run_id}"] },
]

[jobs.cubature-build]
description = "Build Cubature and the lab observer with Java 26 tests and freeze them"
steps = [
  { name = "build cubature", run = ["{python}", "dev/CubicChunks/tools/build_cubature.py", "--no-daemon", "--freeze", "{run_id}"] },
]

[jobs.atlas-golden]
description = "Generated terrain matches the golden atlas digests, with determinism verified"
steps = [
  { name = "golden digests", run = ["{atlas_python}", "tools/atlas_golden.py", "check", "--verify"] },
]

[jobs.definitions]
description = "Definitions catalogues exactly the packaged riven-*.json files, each loads, and the terrain version agrees"
steps = [
  { name = "definitions", run = ["{atlas_python}", "tools/run_check.py", "DefinitionsCheck", "src/main/resources", "."] },
]

[jobs.sample-history]
description = "A reused terrain sample reports what a fresh one does (tools/checks/SampleHistoryCheck)"
steps = [
  { name = "sample history", run = ["{atlas_python}", "tools/run_check.py", "SampleHistoryCheck", "8675309", "101", "-991", "7", "42", "1"] },
]

[jobs.smoke]
description = "Native client/server timing capture of this run's frozen Riven and observer"
needs = ["riven-build", "cubature-build"]
native = true
steps = [
  { name = "doctor", run = ["{python}", "-B", "tools/riven_observe.py", "doctor", "--riven", "{frozen}/riven-cleanroom.jar", "--observer", "{frozen}/lab-cleanroom.jar"] },
  { name = "timing capture", run = ["{python}", "-B", "tools/riven_observe.py", "capture", "--name", "smoke-{run_id}", "--riven", "{frozen}/riven-cleanroom.jar", "--observer", "{frozen}/lab-cleanroom.jar", "--mode", "timing"] },
  { name = "inspect", run = ["{observability_python}", "-B", "tools/riven_observe.py", "inspect", ".local/cubic-standalone/smoke-{run_id}", "--output", ".local/actions/{run_id}/smoke-inspect"] },
]

[quick]
# `actions.py quick` runs the ci jobs that the changes since HEAD can affect: Riven's working tree
# against its HEAD and dev/CubicChunks against its own. A changed path takes the jobs of the first
# rule it matches ("**" crosses folders, "*" does not); a path no rule matches takes every ci job.
# A push still needs every ci job passed for its tree (tools/push_gate.py): ci --if-needed.
riven = [
  { paths = ["docs/**", "tools/tours/**", ".github/**", "CONTRIBUTING.md", "THIRD-PARTY.md", ".editorconfig"], jobs = [] },
  { paths = ["CHANGELOG.md", "README.md"], jobs = ["definitions"] },
  { paths = ["LICENSE", "NOTICE.md", "src/main/resources/assets/**"], jobs = ["quality", "riven-build"] },
  { paths = ["tools/atlas/**", "tools/atlas_golden.py", "tools/terrain_atlas.py", "tools/run_check.py", "tools/checks/**", "tools/atlas-golden.json"], jobs = ["quality", "atlas-golden", "definitions", "sample-history"] },
  { paths = ["tools/build_riven.py"], jobs = ["quality", "riven-build"] },
  { paths = ["tools/**/*.py", "tools/content/**", "pyproject.toml"], jobs = ["quality"] },
]
# Riven builds against the pinned Cubature JARs, so a Cubature change reaches only its own build
# and the tool tests and types in quality.
cubature = [
  { paths = ["docs/**"], jobs = [] },
  { paths = ["**"], jobs = ["quality", "cubature-build"] },
]
