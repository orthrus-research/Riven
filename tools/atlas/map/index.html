<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark" />
    <title>Riven atlas map</title>
    <link rel="stylesheet" href="map.css" />
    <script type="module" src="map.js"></script>
  </head>
  <body>
    <canvas id="map" aria-label="Atlas map: drag to pan, scroll or pinch to zoom, tap to inspect"></canvas>

    <header class="bar">
      <button id="menu-open" class="icon" aria-label="Open the atlas menu" aria-controls="drawer" aria-expanded="false">
        <span class="burger" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <div class="bar__title">
        <span id="projection-name">Atlas</span>
        <span id="render-name" class="dim"></span>
      </div>
      <div id="cursor" class="bar__cursor dim" aria-live="off"></div>
    </header>

    <nav id="drawer" class="drawer" aria-label="Atlas" hidden>
      <div class="drawer__head">
        <span class="wordmark">RIVEN ATLAS</span>
        <button id="menu-close" class="icon" aria-label="Close the atlas menu">&#x2715;</button>
      </div>
      <section class="drawer__section">
        <label class="caption" for="render">Render</label>
        <select id="render"></select>
        <p id="render-facts" class="facts"></p>
      </section>
      <section class="drawer__section">
        <h2 class="caption">Projection</h2>
        <div id="projections"></div>
      </section>
      <section class="drawer__section">
        <h2 class="caption">Overlay</h2>
        <label class="check"><input type="checkbox" id="opt-grid" /> Grid</label>
      </section>
    </nav>

    <aside id="legend" class="panel legend" aria-label="Legend">
      <button id="legend-toggle" class="panel__head" aria-expanded="true">Legend</button>
      <div id="legend-body" class="panel__body"></div>
    </aside>

    <aside id="inspector" class="panel inspector" aria-label="Column inspector" hidden>
      <div class="panel__head">
        <span id="inspector-title">Column</span>
        <button id="inspector-tp" class="text" aria-label="Copy a teleport command for this column">/tp</button>
        <button id="inspector-close" class="icon small" aria-label="Close the inspector">&#x2715;</button>
      </div>
      <dl id="inspector-body" class="panel__body"></dl>
    </aside>

    <div class="zoom" role="group" aria-label="Zoom">
      <button id="zoom-in" class="icon" aria-label="Zoom in">+</button>
      <button id="zoom-out" class="icon" aria-label="Zoom out">&minus;</button>
      <button id="zoom-fit" class="icon" aria-label="Fit the render">&#x25A1;</button>
    </div>

    <div id="scale" class="scale" aria-hidden="true"><i></i><span></span></div>
    <div id="status" class="status" role="status"></div>
  </body>
</html>
