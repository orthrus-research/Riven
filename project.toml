# Riven's checks, the files its build makes and how it is launched. Workbench runs the checks from a clean clone with
# the set's Gradle and JDKs ({gradle}) and {python} the environment made from the three requirements files; a push
# needs the gate's checks passed. Cubature and GTCEuR reach the build, and Gson the offline checks, as the files the
# set names, from the Store by their SHA-256 (or a stand-in). A native capture needs the GPU host, so it is not a
# check: it is a driver session of [launch.default] below (wb play --driver capture). Placeholders: {python},
# {gradle}, {run_id} the run's identifier, {run_dir} its folder, {riven} Riven's root.
#
# `inputs` makes a check pure: globs of every file its verdict depends on, beside its steps and the JDK. A check whose
# exact inputs passed before is not run again; list every file it reads.
schema = 1
gate = ["quality", "riven-build", "regional-store", "drainage-prune", "regional-bake", "atlas-golden",
        "definitions", "sample-history", "variant-coverage"]

[project]
name = "riven"
python = ["tools/requirements-quality.txt", "tools/requirements-atlas.txt", "tools/observability/requirements.txt"]
# atlas-golden claims 16 GiB.
reserve = 16

[uses]
cubature = "compile"
gtceur = "compile"
# The offline checks compile and run worldgen with the set's Gson (tools/set_store.py finds it in the Store).
gson = "compile"

# The production JAR in SRG names is the file the launcher loads; kept by Workbench with its SHA-256 once the check
# passes, so the lab takes these bytes.
[artifacts.mod]
check = "riven-build"
file = "build/libs/riven-*-cleanroom.jar"

[artifacts.dev]
check = "riven-build"
file = "build/libs/riven-*-dev.jar"

[artifacts.sources]
check = "riven-build"
file = "build/libs/riven-*-sources.jar"

# The production JAR is written by CleanroomGradle's renamer on Java 8, so a different Java 8 is a different key.
[settings]
identity_files = ["{env.JAVA_HOME}/release", "{env.JAVA_HOME_8_X64}/release"]

[checks.quality]
description = "Formatting, lint, types, the compile, content assets and the Riven tool tests"
# Riven's tool tests import Cubature's lab tools, laid beside the clone at the commit the set names.
tools = ["cubature:tools/**"]
locks = ["riven-gradle"]
steps = [
  ["{python}", "tools/code_quality.py", "check"],
  ["{python}", "tools/content/build_content.py", "--check"],
  { name = "riven tool tests", run = ["{python}", "-B", "-m", "unittest", "discover", "-s", "tools", "-p", "test_*.py"] },
]

[checks.riven-build]
description = "Build Riven for Cleanroom and compile the diagnostic helpers"
locks = ["riven-gradle"]
memory = 6
steps = [["{gradle}", "assemble", "compileDiagnosticsJava", "--console=plain"]]

[checks.atlas-golden]
description = "Generated terrain matches the golden atlas digests, with determinism verified"
inputs = ["src/main/java/cc/orthrus/riven/worldgen/**/*.java", "src/main/java/cc/orthrus/riven/contrib/**/*.java", "src/main/resources/*.json", "tools/run_check.py", "tools/atlas/build.py", "tools/set_store.py", "tools/atlas_golden.py", "tools/atlas-golden.json", "tools/atlas/*.py", "tools/terrain_atlas.py", "tools/checks/TerrainAtlas.java"]
share = 0.5
memory = 16
priority = 10
steps = [{ name = "golden digests", run = ["{python}", "tools/atlas_golden.py", "check", "--verify"] }]

[checks.atlas-golden-profile]
description = "atlas-golden with every window resampled and a timed second pass over its built plans"
share = 0.5
memory = 16
priority = 10
steps = [{ name = "golden digests", run = ["{python}", "tools/atlas_golden.py", "check", "--verify", "--profile"] }]

[checks.definitions]
description = "Definitions catalogues exactly the packaged riven-*.json files, each loads, and the terrain version agrees"
inputs = ["src/main/java/cc/orthrus/riven/worldgen/**/*.java", "src/main/java/cc/orthrus/riven/contrib/**/*.java", "src/main/resources/*.json", "tools/run_check.py", "tools/atlas/build.py", "tools/set_store.py", "tools/checks/DefinitionsCheck.java", "CHANGELOG.md", "README.md"]
steps = [{ name = "definitions", run = ["{python}", "tools/run_check.py", "DefinitionsCheck", "src/main/resources", "."] }]

[checks.regional-store]
description = "Derived-file and graph integrity, mapped-read lifetime, world ownership and cleanup without constructing terrain"
inputs = ["src/main/java/cc/orthrus/riven/worldgen/**/*.java", "src/main/java/cc/orthrus/riven/contrib/**/*.java", "src/main/resources/*.json", "tools/run_check.py", "tools/atlas/build.py", "tools/set_store.py", "tools/checks/RegionalStoreCheck.java", "tools/checks/DrainageCodecCheck.java", "tools/checks/RegionalOwnershipCheck.java", "tools/checks/RegionalCleanupCheck.java", "src/main/java/cc/orthrus/riven/RegionalOwnership.java", "src/main/java/cc/orthrus/riven/RegionalCleanup.java"]
steps = [
  { name = "regional file store", run = ["{python}", "tools/run_check.py", "RegionalStoreCheck", "{run_dir}/frozen/regional-store-fixtures"] },
  { name = "regional graph and lifetime", run = ["{python}", "-B", "-c", '''
import os
import subprocess
import sys
import tempfile
from pathlib import Path

tools, source, store_check, fixtures, *checks = map(Path, sys.argv[1:])
sys.path.insert(0, str(tools))
from atlas import build

base = build.compile_sampler(source, store_check)
java = build.java()
gson = build.gson()
fixtures.mkdir(parents=True, exist_ok=True)
output = Path(tempfile.mkdtemp(prefix="helpers-", dir=fixtures))
subprocess.run([
    str(build.javac()), "--release", "26", "-Xlint:all,-options", "-Werror",
    "-implicit:none", "-cp", os.pathsep.join(map(str, (base, gson))), "-d", str(output),
    *map(str, checks),
], check=True)
classpath = os.pathsep.join(map(str, (output, base, gson)))
for main, fixture, arguments in [
    ("cc.orthrus.riven.worldgen.DrainageCodecCheck", "codec", ["fixtures"]),
    ("cc.orthrus.riven.RegionalOwnershipCheck", "ownership", []),
    ("cc.orthrus.riven.RegionalCleanupCheck", "cleanup", []),
]:
    subprocess.run([str(java), "-cp", classpath, main, str(output / fixture), *arguments], check=True)
''', "{riven}/tools", "{riven}/src/main", "{riven}/tools/checks/RegionalStoreCheck.java", "{run_dir}/frozen/regional-graph-fixtures", "{riven}/tools/checks/DrainageCodecCheck.java", "{riven}/src/main/java/cc/orthrus/riven/RegionalOwnership.java", "{riven}/src/main/java/cc/orthrus/riven/RegionalCleanup.java", "{riven}/tools/checks/RegionalOwnershipCheck.java", "{riven}/tools/checks/RegionalCleanupCheck.java"] },
]

[checks.drainage-prune]
description = "Drainage answers are unchanged by skipping continents too far to reach a column (tools/checks/DrainagePruneCheck)"
inputs = ["src/main/java/cc/orthrus/riven/worldgen/**/*.java", "src/main/java/cc/orthrus/riven/contrib/**/*.java", "src/main/resources/*.json", "tools/run_check.py", "tools/atlas/build.py", "tools/set_store.py", "tools/checks/DrainagePruneCheck.java"]
memory = 8
priority = 3
steps = [
  { name = "prune, scale 1", run = ["{python}", "tools/run_check.py", "DrainagePruneCheck", "8675309", "1", "8104", "4552", "1000", "250"] },
  { name = "prune, scale 4", run = ["{python}", "tools/run_check.py", "DrainagePruneCheck", "8675309", "4", "64", "-64", "1000", "250"] },
]

[checks.regional-bake]
description = "Region preparation with a store bakes networks to disk and demand reads them back (tools/checks/RegionalBakeCheck)"
inputs = ["src/main/java/cc/orthrus/riven/worldgen/**/*.java", "src/main/java/cc/orthrus/riven/contrib/**/*.java", "src/main/resources/*.json", "tools/run_check.py", "tools/atlas/build.py", "tools/set_store.py", "tools/checks/RegionalBakeCheck.java"]
memory = 8
priority = 6
steps = [
  { name = "bake, scale 1", run = ["{python}", "tools/run_check.py", "RegionalBakeCheck", "{run_dir}/regional-bake", "8675309", "1", "0", "0"] },
  { name = "bake, scale 4", run = ["{python}", "tools/run_check.py", "RegionalBakeCheck", "{run_dir}/regional-bake", "8675309", "4", "0", "0"] },
]

[checks.sample-history]
description = "A reused terrain sample reports what a fresh one does (tools/checks/SampleHistoryCheck), and a stalled shore walk ends its stretch (tools/checks/CoastStretchCheck)"
inputs = ["src/main/java/cc/orthrus/riven/worldgen/**/*.java", "src/main/java/cc/orthrus/riven/contrib/**/*.java", "src/main/resources/*.json", "tools/run_check.py", "tools/atlas/build.py", "tools/set_store.py", "tools/checks/SampleHistoryCheck.java", "tools/checks/CoastStretchCheck.java"]
memory = 8
priority = 4
steps = [
  { name = "sample history", run = ["{python}", "tools/run_check.py", "SampleHistoryCheck", "8675309", "101", "-991", "7", "42", "1"] },
  { name = "coast stretch", run = ["{python}", "tools/run_check.py", "CoastStretchCheck"] },
]

[checks.variant-coverage]
description = "Every biome variant forms patches in a parent biome's climate in every 32 km world (tools/checks/VariantCoverageCheck)"
inputs = ["src/main/java/cc/orthrus/riven/worldgen/**/*.java", "src/main/java/cc/orthrus/riven/contrib/**/*.java", "src/main/resources/*.json", "tools/run_check.py", "tools/atlas/build.py", "tools/set_store.py", "tools/checks/VariantCoverageCheck.java"]
memory = 8
steps = [{ name = "variant coverage", run = ["{python}", "tools/run_check.py", "VariantCoverageCheck", "8", "4"] }]

# The game Riven is played in, resolved once into launch.json by `wb play` (or `wb run lab.resolve folder=<worktree>`):
# every member by SHA-256 from this worktree's set revision, Riven itself from the Store by the tree CI built. The
# instance starts from Cubature's standalone world ([launch.standalone] in Cubature's project.toml, read at the commit
# the set names for Cubature), and launch/configure.py makes Riven's own changes to it on a machine whose [lab]
# trusted names Riven.
[launch.default]
members = ["riven:mod@both", "cubature:mod@both", "orthlib:mod@both", "orthlib:cubature-adapter@both",
           "gtceur:mod@both", "quadrature:mod@client", "modularui@both", "codechickenlib@both", "fugue@both",
           "scalar@both"]
runtime = "cleanroom"
base = "cubature:standalone"
configure = "launch/configure.py"
# Riven goes in as riven.jar, the name its tools and drivers find it by; Fugue is a coremod that must sort before the
# other mod files, as its upstream name does.
place = { "riven:mod@both" = "riven.jar", "fugue@both" = "+Fugue-0.25.5.jar" }
# The game's own refusal of a join; Cubature's [launch.member] adds its own refusal line.
failures = ["Failed to connect to server: .*"]

# What launch/configure.py reads; `wb play --param k=v` sets one for an instance, of the type given here.
[launch.default.params]
seed = 8675309
scale = { type = "float", default = 1.0, min = 0.5, max = 8, summary = "the layout scale, kept in the world's generator settings" }
delivery = { type = "string", default = "PREFETCH", choices = ["BASELINE", "MAINTENANCE", "SAVE", "PREFETCH"], summary = "Cubature's cube delivery mode" }
preview_threads = { type = "int", min = -1, max = 16, summary = "Cubature's preview threads; unset keeps its own" }
spawn_animals = { type = "bool", default = false }
capture = { type = "bool", default = false, summary = "a 2560x1440 client for captures" }

# How lab.run drives a tour (`wb play --tour <file>`): the server's setup, the client's capture switches and the line
# the client prints for each captured view.
[launch.default.tour]
setup = ["gamerule spawnRadius 0", "gamerule doDaylightCycle false", "time set 6000", "weather clear 1000000"]
client_jvm = ["-Driven.tour=true", "-Driven.capture=true", "-Driven.captureTicks=400"]
captured = "Riven view captured"

# Programs that start their own JVMs from the instance's receipt (`wb play --driver <name>`), under the GPU lease
# Workbench holds for the session. {root} is Riven's tree the driver runs from; each driver reads the instance from
# WB_INSTANCE (instance.json) and the session from WB_SESSION (session.json), runs Cubature's lab tools at the commit
# the launch names, and keeps what it measures in the session folder. A driver's further options go in
# LAB_DRIVER_ARGS (for example "--diagnostic", or "--map world-8k").
[launch.default.drivers.pipeline]
summary = "tools/measure_pipeline.py: the terrain-pipeline workload on a fresh copy of the instance"
command = ["{python}", "{root}/tools/measure_pipeline.py"]
cwd = "{root}"

[launch.default.drivers.capture]
summary = "tools/riven_observe.py capture: the pipeline workload with a diagnostic, lifecycle or timing mode's instrumentation"
command = ["{python}", "{root}/tools/riven_observe.py", "capture"]
cwd = "{root}"

[launch.default.drivers.pregenerate]
summary = "tools/pregenerate_map.py run: a bounded terrain pregeneration on the instance itself, resumed by every session (give it --name <map>)"
command = ["{python}", "{root}/tools/pregenerate_map.py", "run"]
cwd = "{root}"

[launch.default.drivers.pregenerate-verify]
summary = "tools/pregenerate_map.py verify: every saved target slot of the instance's pregeneration counted, a sample decoded"
command = ["{python}", "{root}/tools/pregenerate_map.py", "verify"]
cwd = "{root}"
